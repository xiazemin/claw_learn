services:
  pgvector:
    image: pgvector/pgvector:pg18
    container_name: pgvector-demo
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: pgvec
      POSTGRES_PASSWORD: pgvec123
      POSTGRES_DB: pgvector_demo
    volumes:
      - pgvector_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgvec -d pgvector_demo"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgvector_data:
